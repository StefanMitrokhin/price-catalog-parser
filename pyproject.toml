[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "price-catalog-parser"
version = "0.1.0"
description = "Парсер цен и каталогов с выгрузкой в Excel и CSV"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Mitrokhin" }]
keywords = ["scraping", "prices", "excel", "csv", "portfolio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer==0.29.2",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "openpyxl==3.1.5",
  "pyyaml==6.0.4",
  "pydantic==2.14.4",
]

[project.optional-dependencies]
dev = [
  "ruff==0.17.6",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.5.0",
  "mypy==2.4.1",
]

[project.urls]
Homepage = "https://github.com/StefanMitrokhin/price-catalog-parser"
Repository = "https://github.com/StefanMitrokhin/price-catalog-parser"

[project.scripts]
priceparser = "priceparser.cli:app"

[tool.hatch.build.targets.wheel]
only-include = ["priceparser"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/priceparser", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/priceparser/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["priceparser"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["priceparser"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["priceparser"]
mypy_path = "src"
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["bs4.*", "lxml.*", "yaml.*", "openpyxl.*"]
ignore_missing_imports = true